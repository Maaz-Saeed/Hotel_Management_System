<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grand Hotel | Management</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="login" class="login hidden">
    <div class="hero"><div class="logo">🏨</div><h1>Run your hotel<br>with confidence</h1>
      <p>One place for rooms, guests, bookings and payments.</p>
      <ul><li>Live room availability</li><li>Safe double-booking protection</li><li>Clear daily reports</li></ul></div>
    <div class="lform"><form id="lf"><h2>Welcome back</h2><p class="mut">Sign in to the management system</p>
      <label>Email</label><input name="email" type="email" required autofocus>
      <label>Password</label><input name="password" type="password" required>
      <div id="lerr" class="err"></div><button class="btn full">Sign in</button></form></div>
  </div>

  <div id="shell" class="shell hidden">
    <aside class="side">
      <div class="brand">🏨 <span>Grand Hotel</span></div>
      <nav id="nav"></nav>
      <div class="user"><div id="who"></div><button id="logout" class="btn ghost sm">Sign out</button></div>
    </aside>
    <main>
      <header><div><h1 id="title"></h1><p id="sub" class="mut"></p></div><div id="bar"></div></header>
      <section id="view"></section>
    </main>
  </div>

  <div id="modal" class="modal hidden">
    <div class="box"><div class="mh"><h3 id="mtitle"></h3><button id="mclose" class="x" aria-label="Close">×</button></div><div id="mbody"></div></div>
  </div>
  <div id="toasts"></div>

  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/views.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
